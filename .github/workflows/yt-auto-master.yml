name: YT Auto Master Pipeline (Part 2 → Part 3 → Part 4)

on:
  workflow_dispatch:
    inputs:
      runner_type:
        description: "Use GitHub-hosted runner for smaller batches, or a configured Linux x64 self-hosted runner for large videos."
        type: choice
        required: true
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - self-hosted
      max_parallel_videos:
        description: "Part 2 parallel video workers. Use 1 for lower memory usage."
        type: choice
        required: true
        default: "1"
        options:
          - "1"
          - "2"
      archive_source_data:
        description: "Include original Drive downloads and assets in the final artifact (larger artifact)."
        type: boolean
        required: true
        default: true
      artifact_retention_days:
        description: "How many days to retain the full-run artifact."
        type: choice
        required: true
        default: "7"
        options:
          - "1"
          - "3"
          - "7"
          - "14"
          - "30"

permissions:
  contents: read

concurrency:
  group: yt-auto-master-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-all-parts:
    name: Run Part 2, Part 3, and Part 4 in sequence
    runs-on: ${{ inputs.runner_type == 'self-hosted' && fromJSON('["self-hosted", "linux", "x64"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 350

    env:
      RUNNER_TYPE: ${{ inputs.runner_type }}
      DRIVE_ASSETS_URL: ${{ secrets.DRIVE_ASSETS_URL }}
      DRIVE_DOWNLOAD_URL: ${{ secrets.DRIVE_DOWNLOAD_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_DRIVE_REPORTS_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_REPORTS_FOLDER_ID }}
      GOOGLE_DRIVE_THUMBNAIL_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_THUMBNAIL_FOLDER_ID }}
      MAX_PARALLEL_VIDEOS: ${{ inputs.max_parallel_videos }}
      SCHEDULE_TIMEZONE: Asia/Karachi
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          clean: true
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            part3-requirements.txt
            part4-requirements.txt

      - name: Check runner disk and install system dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Runner: $RUNNER_TYPE"
          echo "Workspace: $GITHUB_WORKSPACE"
          df -h "$GITHUB_WORKSPACE" | tee -a "$GITHUB_STEP_SUMMARY"

          if [[ "$RUNNER_TYPE" == "ubuntu-latest" ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          else
            command -v ffmpeg >/dev/null || {
              echo "::error::FFmpeg is missing on the self-hosted runner. Install FFmpeg and ffprobe first."
              exit 1
            }
            command -v ffprobe >/dev/null || {
              echo "::error::ffprobe is missing on the self-hosted runner."
              exit 1
            }
            test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf || {
              echo "::error::DejaVuSans-Bold.ttf is missing. Install fonts-dejavu-core on the self-hosted runner."
              exit 1
            }
          fi

          ffmpeg -version | head -n 2
          ffprobe -version | head -n 1
          echo "Free space after setup:"
          df -h "$GITHUB_WORKSPACE"

      - name: Prepare clean run folders
        shell: bash
        run: |
          set -Eeuo pipefail
          # Safe for repeat runs, including persistent self-hosted workspaces.
          rm -rf download assets clips "Ready_!" Part_4_Output executed logs run_manifest.json
          mkdir -p download assets clips "Ready_!" Part_4_Output executed logs
          printf 'Master pipeline started at %s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > logs/pipeline.log

      - name: Install all Python dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements.txt \
            -r part3-requirements.txt \
            -r part4-requirements.txt
          python -m pip check

      - name: Validate secrets, notebooks, and Python syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import nbformat

          required = [
              "DRIVE_ASSETS_URL",
              "DRIVE_DOWNLOAD_URL",
              "GOOGLE_SERVICE_ACCOUNT_JSON",
              "GOOGLE_DRIVE_REPORTS_FOLDER_ID",
          ]
          missing = [name for name in required if not os.environ.get(name, "").strip()]
          if missing:
              raise SystemExit("Missing required GitHub Secrets: " + ", ".join(missing))

          if not (os.getenv("OPENROUTER_API_KEY", "").strip()
                  or os.getenv("GROQ_API_KEY", "").strip()):
              raise SystemExit("Add at least one AI key: OPENROUTER_API_KEY or GROQ_API_KEY.")

          try:
              json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"])
          except json.JSONDecodeError as exc:
              raise SystemExit("GOOGLE_SERVICE_ACCOUNT_JSON is not valid JSON.") from exc

          for filename in ("Part_2.ipynb", "Part_3.ipynb", "Part_4.ipynb"):
              path = Path(filename)
              if not path.is_file():
                  raise SystemExit(f"Required notebook is missing: {filename}")
              notebook = nbformat.read(path, as_version=4)
              nbformat.validate(notebook)
              code = "\n\n".join(
                  cell.source for cell in notebook.cells if cell.cell_type == "code"
              )
              compile(code, filename, "exec")
              print(f"Validated: {filename}")

          for filename in (
              "requirements.txt",
              "part3-requirements.txt",
              "part4-requirements.txt",
          ):
              if not Path(filename).is_file():
                  raise SystemExit(f"Required dependency file is missing: {filename}")
          print("Secrets, notebook structure, syntax, and dependency files validated.")
          PY

      # ---------------------------- PART 2 ----------------------------
      - name: "PART 2 — Download Drive folders and create clips"
        id: part2
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m jupyter nbconvert --to notebook --execute Part_2.ipynb \
            --output Part_2.executed.ipynb \
            --output-dir executed \
            --ExecutePreprocessor.timeout=-1 \
            --ExecutePreprocessor.kernel_name=python3 \
            2>&1 | tee logs/Part_2.log

      - name: Validate Part 2 output
        id: validate_part2
        shell: bash
        run: |
          set -Eeuo pipefail
          count=$(find clips -type f -iname '*.mp4' | wc -l)
          echo "Part 2 MP4 count: $count"
          echo "Part 2 MP4 count: **$count**" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$count" -eq 0 ]]; then
            echo "::error::Part 2 completed but produced no MP4 files under clips/."
            find download -maxdepth 4 -type f | head -n 100 || true
            exit 1
          fi

      # ---------------------------- PART 3 ----------------------------
      - name: "PART 3 — Edit Part 2 clips into Ready_!"
        id: part3
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m jupyter nbconvert --to notebook --execute Part_3.ipynb \
            --output Part_3.executed.ipynb \
            --output-dir executed \
            --ExecutePreprocessor.timeout=-1 \
            --ExecutePreprocessor.kernel_name=python3 \
            2>&1 | tee logs/Part_3.log

      - name: Validate Part 3 output
        id: validate_part3
        shell: bash
        run: |
          set -Eeuo pipefail
          count=$(find "Ready_!" -type f \( -iname '*.mp4' -o -iname '*.mov' -o -iname '*.avi' -o -iname '*.mkv' \) | wc -l)
          echo "Part 3 processed video count: $count"
          echo "Part 3 processed video count: **$count**" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$count" -eq 0 ]]; then
            echo "::error::Part 3 completed but produced no videos under Ready_!."
            find clips -maxdepth 4 -type f | head -n 100 || true
            exit 1
          fi

      # ---------------------------- PART 4 ----------------------------
      - name: "PART 4 — Generate metadata, Google Sheets reports, and thumbnails"
        id: part4
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m jupyter nbconvert --to notebook --execute Part_4.ipynb \
            --output Part_4.executed.ipynb \
            --output-dir executed \
            --ExecutePreprocessor.timeout=-1 \
            --ExecutePreprocessor.kernel_name=python3 \
            2>&1 | tee logs/Part_4.log

      - name: Validate Part 4 output
        id: validate_part4
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s Part_4_Output/metadata_rows.csv || {
            echo "::error::Part 4 did not create Part_4_Output/metadata_rows.csv."
            exit 1
          }
          test -s Part_4_Output/run_summary.json || {
            echo "::error::Part 4 did not create Part_4_Output/run_summary.json."
            exit 1
          }
          python -m json.tool Part_4_Output/run_summary.json >/dev/null
          echo "Part 4 CSV and JSON outputs validated." >> "$GITHUB_STEP_SUMMARY"

      - name: Create complete run manifest and summary
        if: always()
        shell: bash
        env:
          PART2_OUTCOME: ${{ steps.part2.outcome }}
          PART3_OUTCOME: ${{ steps.part3.outcome }}
          PART4_OUTCOME: ${{ steps.part4.outcome }}
          PART2_VALIDATION: ${{ steps.validate_part2.outcome }}
          PART3_VALIDATION: ${{ steps.validate_part3.outcome }}
          PART4_VALIDATION: ${{ steps.validate_part4.outcome }}
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from datetime import datetime, timezone

          roots = [
              "download", "assets", "clips", "Ready_!",
              "Part_4_Output", "executed", "logs"
          ]
          files = []
          total_bytes = 0
          for root in roots:
              base = Path(root)
              if not base.exists():
                  continue
              for item in sorted(base.rglob("*")):
                  if item.is_file():
                      try:
                          size = item.stat().st_size
                      except OSError:
                          size = None
                      if size is not None:
                          total_bytes += size
                      files.append({
                          "path": item.as_posix(),
                          "size_bytes": size,
                      })

          manifest = {
              "pipeline": "YT Auto Master Pipeline",
              "run_id": os.getenv("GITHUB_RUN_ID"),
              "run_number": os.getenv("GITHUB_RUN_NUMBER"),
              "run_attempt": os.getenv("GITHUB_RUN_ATTEMPT"),
              "repository": os.getenv("GITHUB_REPOSITORY"),
              "commit": os.getenv("GITHUB_SHA"),
              "ref": os.getenv("GITHUB_REF"),
              "runner_type": os.getenv("RUNNER_TYPE"),
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "stage_outcomes": {
                  "part_2": os.getenv("PART2_OUTCOME"),
                  "part_2_validation": os.getenv("PART2_VALIDATION"),
                  "part_3": os.getenv("PART3_OUTCOME"),
                  "part_3_validation": os.getenv("PART3_VALIDATION"),
                  "part_4": os.getenv("PART4_OUTCOME"),
                  "part_4_validation": os.getenv("PART4_VALIDATION"),
              },
              "file_count": len(files),
              "total_file_bytes": total_bytes,
              "files": files,
          }
          Path("run_manifest.json").write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False),
              encoding="utf-8"
          )
          print(f"Manifest created: {len(files)} files, {total_bytes:,} bytes.")
          PY

          {
            echo ""
            echo "## YT Auto Master artifact"
            echo "- Run: $GITHUB_RUN_NUMBER (attempt $GITHUB_RUN_ATTEMPT)"
            echo "- Part 2: $PART2_OUTCOME / validation: $PART2_VALIDATION"
            echo "- Part 3: $PART3_OUTCOME / validation: $PART3_VALIDATION"
            echo "- Part 4: $PART4_OUTCOME / validation: $PART4_VALIDATION"
            echo "- Manifest: \`run_manifest.json\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload FULL artifact (original downloads + assets + all stage outputs)
        if: ${{ always() && inputs.archive_source_data }}
        uses: actions/upload-artifact@v7
        with:
          name: yt-auto-full-run-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: |
            download/
            assets/
            clips/
            Ready_!/
            Part_4_Output/
            executed/
            logs/
            run_manifest.json
            Part_2.ipynb
            Part_3.ipynb
            Part_4.ipynb
            requirements.txt
            part3-requirements.txt
            part4-requirements.txt
            .github/workflows/yt-auto-master.yml
          if-no-files-found: warn
          retention-days: ${{ inputs.artifact_retention_days }}
          compression-level: 0

      - name: Upload PROCESSED artifact (skip original downloads and assets)
        if: ${{ always() && !inputs.archive_source_data }}
        uses: actions/upload-artifact@v7
        with:
          name: yt-auto-processed-run-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: |
            clips/
            Ready_!/
            Part_4_Output/
            executed/
            logs/
            run_manifest.json
            Part_2.ipynb
            Part_3.ipynb
            Part_4.ipynb
          if-no-files-found: warn
          retention-days: ${{ inputs.artifact_retention_days }}
          compression-level: 0
