name: Part 2 - Drive Download and Video Clips

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: part2-video-processing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  process-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DRIVE_ASSETS_URL: ${{ secrets.DRIVE_ASSETS_URL }}
      DRIVE_DOWNLOAD_URL: ${{ secrets.DRIVE_DOWNLOAD_URL }}
      MAX_PARALLEL_VIDEOS: "2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install FFmpeg on the GitHub runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 2
          ffprobe -version | head -n 1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate secrets and notebook
        run: |
          python - <<'PY'
          import os
          import nbformat

          for key in ("DRIVE_ASSETS_URL", "DRIVE_DOWNLOAD_URL"):
              if not os.environ.get(key, "").strip():
                  raise SystemExit(f"Missing required GitHub secret: {key}")

          notebook = nbformat.read("Part_2.ipynb", as_version=4)
          nbformat.validate(notebook)
          code = "\n\n".join(c.source for c in notebook.cells if c.cell_type == "code")
          compile(code, "Part_2.ipynb", "exec")
          print("Notebook syntax and secrets validated.")
          PY

      - name: Execute notebook
        run: |
          mkdir -p executed
          jupyter nbconvert --to notebook --execute Part_2.ipynb \
            --output Part_2.executed.ipynb --output-dir executed \
            --ExecutePreprocessor.timeout=-1 \
            --ExecutePreprocessor.kernel_name=python3

      - name: Upload output clips and execution notebook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part2-output-${{ github.run_number }}
          path: |
            clips/**
            executed/Part_2.executed.ipynb
          if-no-files-found: warn
          retention-days: 7
