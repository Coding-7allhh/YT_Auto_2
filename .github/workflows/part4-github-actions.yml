name: Part 4 - Generate Social Metadata

on:
  workflow_run:
    workflows: ["Part 3 - Process Part 2 Artifact"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: part4-social-metadata
  cancel-in-progress: false

jobs:
  generate-metadata:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_DRIVE_REPORTS_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_REPORTS_FOLDER_ID }}
      GOOGLE_DRIVE_THUMBNAIL_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_THUMBNAIL_FOLDER_ID }}
      SCHEDULE_TIMEZONE: Asia/Karachi
      PART3_OUTPUT_DIR: Ready_!

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: part4-requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 2
          ffprobe -version | head -n 1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r part4-requirements.txt

      - name: Download Part 3 output artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ github.event.workflow_run.id }}
          name: part3-ready-videos-${{ github.event.workflow_run.run_number }}
          path: Ready_!

      - name: Validate secrets and Part 3 input
        run: |
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON" || { echo "Missing GOOGLE_SERVICE_ACCOUNT_JSON secret"; exit 1; }
          test -n "$GOOGLE_DRIVE_REPORTS_FOLDER_ID" || { echo "Missing GOOGLE_DRIVE_REPORTS_FOLDER_ID secret"; exit 1; }
          test -n "$OPENROUTER_API_KEY" || test -n "$GROQ_API_KEY" || {
            echo "Add at least one of OPENROUTER_API_KEY or GROQ_API_KEY"; exit 1;
          }
          python - <<'PY'
          import json, os
          json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"])
          print("Google service-account JSON is valid.")
          PY
          test -f Part_4.ipynb || { echo "Part_4.ipynb is missing"; exit 1; }
          find Ready_! -type f \( -iname '*.mp4' -o -iname '*.mov' -o -iname '*.avi' -o -iname '*.mkv' \) -print -quit | grep -q . || {
            echo "No supported video files were found in the Part 3 artifact.";
            find Ready_! -maxdepth 4 -type f | head -n 100;
            exit 1;
          }
          python - <<'PY'
          import nbformat
          nb = nbformat.read("Part_4.ipynb", as_version=4)
          nbformat.validate(nb)
          source = "\n\n".join(c.source for c in nb.cells if c.cell_type == "code")
          compile(source, "Part_4.ipynb", "exec")
          print("Part 4 notebook structure and Python syntax validated.")
          PY

      - name: Execute Part 4 notebook
        run: |
          mkdir -p executed
          jupyter nbconvert --to notebook --execute Part_4.ipynb \
            --output Part_4.executed.ipynb --output-dir executed \
            --ExecutePreprocessor.timeout=-1 \
            --ExecutePreprocessor.kernel_name=python3

      - name: Upload Part 4 metadata artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part4-metadata-output-${{ github.run_number }}
          path: |
            Part_4_Output/**
            executed/Part_4.executed.ipynb
          if-no-files-found: warn
          retention-days: 7
