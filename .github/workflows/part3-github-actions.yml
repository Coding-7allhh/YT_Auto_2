name: Part 3 - Process Part 2 Artifact

on:
 workflow_dispatch:
  workflow_run:
    workflows: ["Part 2 - Drive Download and Video Clips"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: part3-video-processing
  cancel-in-progress: false

jobs:
  process-part3:
    # Only continue automatically when the Part 2 workflow succeeded.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DRIVE_ASSETS_URL: ${{ secrets.DRIVE_ASSETS_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: part3-requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          ffmpeg -version | head -n 2
          ffprobe -version | head -n 1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r part3-requirements.txt

      - name: Download Part 2 output artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ github.event.workflow_run.id }}
          name: part2-output-${{ github.event.workflow_run.run_number }}
          path: .

      - name: Validate Part 2 input and secrets
        run: |
          test -n "$DRIVE_ASSETS_URL" || { echo "Missing DRIVE_ASSETS_URL secret"; exit 1; }
          test -f Part_3.ipynb || { echo "Part_3.ipynb not found at repository root"; exit 1; }
          find clips -type f -iname '*.mp4' -print -quit | grep -q . || {
            echo "No MP4 files found in downloaded Part 2 artifact under clips/"
            find . -maxdepth 3 -type f | head -n 100
            exit 1
          }
          python - <<'PY'
          import nbformat
          nb = nbformat.read("Part_3.ipynb", as_version=4)
          nbformat.validate(nb)
          code = "\n\n".join(c.source for c in nb.cells if c.cell_type == "code")
          compile(code, "Part_3.ipynb", "exec")
          print("Part 3 notebook structure and syntax validated.")
          PY

      - name: Execute Part 3 notebook
        run: |
          mkdir -p executed
          jupyter nbconvert --to notebook --execute Part_3.ipynb \
            --output Part_3.executed.ipynb --output-dir executed \
            --ExecutePreprocessor.timeout=-1 \
            --ExecutePreprocessor.kernel_name=python3

      - name: Upload Part 3 processed videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part3-ready-videos-${{ github.run_number }}
          path: |
            Ready_!/**
            executed/Part_3.executed.ipynb
          if-no-files-found: warn
          retention-days: 7
